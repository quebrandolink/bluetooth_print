group 'com.example.bluetooth_print'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral() // Substitui o jcenter() (que está obsoleto)
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.2' // Versão mais recente
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral() // Substitui o jcenter() (que está obsoleto)
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 31

    // Specify the namespace here
    namespace 'com.example.bluetooth_print' // Add this line

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33 // Adicionado targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation files('libs/gprintersdkv2.jar')
    implementation "androidx.core:core:1.6.0"
    // implementation files("D:\\devtools\\flutter\\bin\\cache\\artifacts\\engine\\android-x64\\flutter.jar")
}
